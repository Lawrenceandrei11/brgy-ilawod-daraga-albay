# Supabase CLI configuration.
#
# Added for one reason: the public Edge Functions must be deployed without JWT
# verification, and until now that lived only as a `--no-verify-jwt` flag in
# the README and in whoever's shell history. Pinning it here means a plain
# `supabase functions deploy` does the right thing.
#
# Everything else is left to the CLI's defaults on purpose.

project_id = "barangay-e-assist"

[functions.face-login]
# Face sign-in happens *before* the resident has a session, so there is no JWT
# to verify. The function does its own IP-keyed lockout and audit logging.
verify_jwt = false

[functions.admin-create-user]
# The opposite of the two below: only a signed-in caller may reach it, and the
# function then checks that the caller's own profile is barangay staff before
# creating anything.
verify_jwt = true

[functions.id-extract]
# RETIRED. This endpoint used to send a resident ID photo to Gemini; it now
# answers 410 Gone and does nothing else -- no body read, no secret, no
# network. verify_jwt stays false so that a browser still running an older
# bundle gets the 410 and its message rather than an authentication error.
# Remove this entry together with the function, once nothing calls it.
verify_jwt = false

[functions.sms-diagnose]
# Same reasoning as sms-dispatch, and the same shared secret. Without this
# entry the CLI would default verify_jwt to true, which would reject the
# cron/operator calls that authenticate with x-sms-dispatch-secret instead.
# It can only GET from Semaphore, so it cannot send.
verify_jwt = false

[functions.sms-dispatch]
# Not laxer than face-login, stricter. verify_jwt would accept any resident's
# token and then let them drain the SMS queue; this function checks a
# dedicated x-sms-dispatch-secret header instead.
verify_jwt = false
