[build]
  command = "npm run build"
  publish = "dist"

# React Router owns the URLs, so every path must serve index.html.
# Without this, /app/requests works when clicked but 404s on refresh.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/models/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # The camera is needed by face sign-in on this origin, and by nothing else.
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"
